services:
  db:
    image: postgres:15-alpine
    container_name: sportsmanager-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sportsmanager
      POSTGRES_USER: sportsmanager
      POSTGRES_PASSWORD: sportsmanager123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sportsmanager"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sportsmanager-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/sportsmanager
      SPRING_DATASOURCE_USERNAME: sportsmanager
      SPRING_DATASOURCE_PASSWORD: sportsmanager123
      JWT_SECRET: docker-compose-jwt-secret-key-min-32-characters-long
      JWT_EXPIRATION: "86400000"
      APP_CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:80,http://localhost:3000
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/auth/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    container_name: sportsmanager-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  pgdata:
