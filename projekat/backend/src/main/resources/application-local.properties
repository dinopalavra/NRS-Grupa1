spring.application.name=sports-manager
server.port=8080

# H2 in-memory baza, prazna pri svakom startu
spring.datasource.url=jdbc:h2:mem:sportsmanager;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 console: http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:sportsmanager)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

jwt.secret=local-dev-only-secret-key-must-be-at-least-32-chars-long-1234567890
jwt.expiration=86400000

app.cors.allowed-origins=http://localhost:5173,http://localhost:4173
